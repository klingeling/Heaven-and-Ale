services:
  - type: web
    name: heaven-and-ale-test-api-2026
    runtime: node
    region: singapore
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm run server
    envVars:
      - key: CLIENT_ORIGINS
        value: https://heaven-and-ale-test-web-2026.onrender.com
      - key: SUPABASE_URL
        value: https://luvbolgmebuppqhegpiv.supabase.co
      - key: SUPABASE_SECRET_KEY
        sync: false

  - type: web
    name: heaven-and-ale-test-web-2026
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_GAME_SERVER
        value: https://heaven-and-ale-test-api-2026.onrender.com
      - key: VITE_SUPABASE_URL
        value: https://luvbolgmebuppqhegpiv.supabase.co
      - key: VITE_SUPABASE_PUBLISHABLE_KEY
        value: sb_publishable_4_u36_fyWYyRs3x5o2jcfQ_nL7qefe8
